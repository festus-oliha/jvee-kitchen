[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"   # notify.mts: email alerts for new orders and basket enquiries

[build.environment]
  NODE_VERSION = "20"

# Fonts never change name, so browsers can keep them for a year too
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Send every page address to the app so links like /menu work after a refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
